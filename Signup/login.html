<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div id="page">
    <header>
      <h3>11ElevenLabs</h3>
    </header>
    <main>
      <div>
        <h2>Create an account</h2>
      </div>
      <div id="signup-btn" >
        <div id="signup-logo" >
          <img src="./image.png" alt="Google Logo">
        </div>
        <div id="signup-text">
          <p>Sign Up with Google</p>
        </div>
      </div>

      <hr>
      <label for="email">Email</label>
      <input type="email" id="email">
      <label for="password">Password</label>
      <div id="password">
        <input type="password" id="password">
        <img src="image_copy.png" alt="pass-visible">
      </div>
      <button>
        Sign up
      </button>
      <div id="registered">
        <p>
          Already registered? <a href="https://www.google.com">Sign in</a>
        </p>
      </div>
    </main>
    <footer>
      <p>By contiuining, you agree to our 
        <a href="terms.html">Terms of Service</a>
        and
        <a href="policy.html">Privacy Policy</a>
      </p>
    </footer>
  </div>
</body>
</html>
